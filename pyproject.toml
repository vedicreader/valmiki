[project]
name = "valmiki"
version = "0.1.0"
description = "A modular agent UI, built one block at a time"
authors = [{ name = "Karthik Rajgopal", email = "karthik.rajgopal@hotmail.com" }]
requires-python = ">=3.13"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "diskcache>=5.6.3",
    "email-validator>=2.3.0",
    "fastlite>=0.1.3",
    "fastlucide>=0.0.7",
    "pyjwt>=2.11.0",
    "python-fasthtml>=0.14.0",
    "rcssmin>=1.2.2",
    "resend>=2.22.0",
    "rjsmin>=1.2.5",
    "ujson>=5.11.0",
]

[project.scripts]
valmiki = "valmiki.app:launch"
valmiki-setup = "setup:setup"

[project.urls]
Homepage = "https://github.com/vedicreader/valmiki"
Issues = "https://github.com/vedicreader/valmiki/issues"

[tool.hatch.build.targets.wheel]
packages = ["valmiki"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.3", "httpx>=0.28"]
